# Minton's Status page (ADR-0041): the Upptime configuration the wizard
# (`scripts/status-page-wizard.sh`) copies into the public status repository
# `HanfiroBoy/minton-status`. Edit it here, then re-run the wizard's config
# stage (or copy and push it by hand) so the two never drift.
#
# Two lines, no more (ADR-0041): App and Sign-in, the two things that stop a
# club night. Each probes an endpoint that proves what the line claims.
owner: HanfiroBoy
repo: minton-status
user-agent: HanfiroBoy

sites:
  # The desk can read its data: one read against the SQLite file on the volume.
  - name: App
    url: https://app.minton.net.nz/healthz/store
    expectedStatusCodes: [200]
    # Degraded above this, not down: the runner is in the US and the Machine in Sydney.
    maxResponseTime: 5000
  # Organisers can sign in: Clerk answers us, asked at most once a minute.
  - name: Sign-in
    url: https://app.minton.net.nz/healthz/signin
    expectedStatusCodes: [200]
    maxResponseTime: 5000
  - name: Alert test
    url: https://app.minton.net.nz/healthz
    expectedStatusCodes: [200]

# Who is assigned each outage issue: the Operator.
assignees:
  - HanfiroBoy

# Keep short outage issues: a 3-minute blip on club night is still worth seeing.
skipDeleteIssues: true

status-website:
  cname: status.minton.net.nz
  name: Minton status
  introTitle: '**Minton** status'
  introMessage: 'Is Minton down, or is it you? **App** is the desk and the board reading their data; **Sign-in** is Organisers logging in. Each is checked every five minutes. Planned maintenance and outages are posted below.'
  navbar:
    - title: Status
      href: /
    - title: Minton
      href: https://minton.net.nz
    - title: Help
      href: https://minton.net.nz/help

# Every 5 minutes is Upptime's default; it is free on a public repository.
workflowSchedule:
  uptime: '*/5 * * * *'
